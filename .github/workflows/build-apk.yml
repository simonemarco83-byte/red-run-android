name: Build Red Run APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Red Run
        run: |
          mkdir build-src
          unzip -q RED_RUN_ANDROID_PROJECT.zip -d build-src

      - name: Build APK
        working-directory: build-src/red_run_android_app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare RedRun.apk
        run: |
          cp build-src/red_run_android_app/app/build/outputs/apk/debug/app-debug.apk RedRun.apk

      - name: Upload RedRun APK
        uses: actions/upload-artifact@v4
        with:
          name: RedRun-APK
          path: RedRun.apk
